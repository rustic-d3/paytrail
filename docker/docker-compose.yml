
# Specify the compose format that this file conforms to.

services:
  # Specify the set of containers that your app is composed of.

  frontend:
    build: ../client/frontend
    environment:
      - VITE_BASE_URL=http://localhost:80

    ports:
      - "5173:5173"
  authentication_service:
    build: ../backend/authentication_service
    env_file:
      - ../backend/authentication_service/.env
    environment:
      - CORS_ALLOWED_ORIGINS=http://localhost:5173
      - ENVIRONMENT=local
  authentication_service2:
    build: ../backend/authentication_service
    env_file:
      - ../backend/authentication_service/.env
    environment:
      - CORS_ALLOWED_ORIGINS=http://localhost:5173
      - ENVIRONMENT=local
  salary_reports_service:
    build: ../backend/salary_reports_service
    env_file:
      - ../backend/salary_reports_service/.env
    environment:
      - CORS_ALLOWED_ORIGINS=http://localhost:5173
      - ENVIRONMENT=local
  salary_reports_service2:
    build: ../backend/salary_reports_service
    env_file:
      - ../backend/salary_reports_service/.env
    environment:
      - CORS_ALLOWED_ORIGINS=http://localhost:5173
      - ENVIRONMENT=local
  user_service:
    build: ../backend/user_service
    env_file:
      - ../backend/user_service/.env
    environment:
      - CORS_ALLOWED_ORIGINS=http://localhost:5173
      - ENVIRONMENT=local
  user_service2:
    build: ../backend/user_service
    env_file:
      - ../backend/user_service/.env
    environment:
      - CORS_ALLOWED_ORIGINS=http://localhost:5173
      - ENVIRONMENT=local
  nginx:
    image: nginx:stable-alpine3.24
    volumes:
      - ../nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ../nginx/snippets:/etc/nginx/snippets:ro
    ports:
      - "80:80"
