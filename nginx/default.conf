upstream authentication_service {
    zone authentication_zone 64k;
    server authentication_service:8000;
    server authentication_service2:8000;

 }
upstream salary_reports_service {
    zone reports_zone 64k;
    server salary_reports_service:8000;
    server salary_reports_service2:8000;

 }
upstream user_service {
    zone user_zone 64k;
    server user_service:8000;
    server user_service2:8000;

 }

error_page 429 @too_many;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=2r/s;

server {
    listen 80;

    location /api/authentication/ {
        include /etc/nginx/snippets/proxy_headers.conf;
        proxy_pass http://authentication_service;

    }
    location /api/employees/ {
        include /etc/nginx/snippets/proxy_headers.conf;
        proxy_pass http://user_service;

    }
    location /api/reports/ {
        include /etc/nginx/snippets/proxy_headers.conf;
        proxy_pass http://salary_reports_service;

    }
    location / {
        return 404 '{"error": "route not found"}';
        default_type application/json;
        
    }
    location @too_many {
        default_type application/json;
        return 429 '{"error": "Too many requests"}';
        
    }

 }

